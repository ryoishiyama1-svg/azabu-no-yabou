<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>麻布の野望</title>
  <meta name="description" content="麻布高校が都内の高校を攻略していく国盗りシミュレーション">
  <meta name="theme-color" content="#1c1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻布の野望">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <!-- 武将の絵で使う柄（js/ukiyo.js）。家の色の亀甲柄は #ukiyo-defs に自動で足される -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs id="ukiyo-defs">
      <linearGradient id="bokashi" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#22406b"/><stop offset="0.55" stop-color="#22406b" stop-opacity="0.35"/><stop offset="1" stop-color="#22406b" stop-opacity="0"/>
      </linearGradient>
      <pattern id="seigaiha" width="30" height="15" patternUnits="userSpaceOnUse">
        <rect width="30" height="15" fill="#2d5288"/>
        <g fill="none" stroke="#f1e6cc" stroke-width="1.6"><circle cx="15" cy="15" r="13"/><circle cx="15" cy="15" r="8"/><circle cx="15" cy="15" r="3"/><circle cx="0" cy="7.5" r="13"/><circle cx="30" cy="7.5" r="13"/></g>
      </pattern>
      <pattern id="asanoha" width="40" height="46" patternUnits="userSpaceOnUse">
        <rect width="40" height="46" fill="#f3d5d6"/>
        <g stroke="#e9a3a8" stroke-width="1.4" fill="none"><path d="M20,0 L20,46 M0,11.5 L40,34.5 M40,11.5 L0,34.5 M20,23 L0,0 M20,23 L40,0 M20,23 L0,46 M20,23 L40,46"/></g>
      </pattern>
      <pattern id="ichimatsu" width="24" height="24" patternUnits="userSpaceOnUse">
        <rect width="24" height="24" fill="#d8e0c8"/><rect width="12" height="12" fill="#b8c9a4"/><rect x="12" y="12" width="12" height="12" fill="#b8c9a4"/>
      </pattern>
    </defs>
  </svg>
  <!-- タイトル -->
  <section id="title" class="screen">
    <div id="title-art"></div>
    <div class="petals" id="title-petals"></div>
    <button class="title-sound" id="title-sound" aria-label="音楽"></button>
    <div class="title-inner">
      <div class="title-crest" id="title-crest"></div>
      <div class="title-head">
        <h1 class="title-tanzaku">麻布の野望</h1>
        <div class="title-side">
          <p class="tagline">都内高校国盗り絵巻</p>
          <div class="seal">麻布<br>之印</div>
        </div>
      </div>
      <div class="title-buttons">
        <button class="btn fuda" id="btn-resume" hidden>つづきから</button>
        <button class="btn fuda red" id="btn-new">天下統一をめざす</button>
        <button class="btn fuda" id="btn-help">遊び方</button>
        <button class="btn fuda" id="btn-records">戦績・実績</button>
      </div>
      <p class="disclaimer">※実在の学校名を使ったフィクションです。兵力などの能力値や家紋はすべて架空で、実際の学校とは関係ありません。</p>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="game" class="screen" hidden>
    <header class="hud">
      <span id="hud-crest"></span>
      <div class="hud-date" id="hud-date"></div>
      <div class="hud-item"><span class="l">金</span><b id="hud-gold"></b></div>
      <div class="hud-item"><span class="l">城</span><b id="hud-castles"></b></div>
      <button class="icon" id="btn-sound" aria-label="効果音"></button>
      <button class="icon" id="btn-menu" aria-label="メニュー">☰</button>
    </header>

    <div class="map-area">
      <div id="mapwrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="petals" id="map-petals"></div>
      <div class="zoom">
        <button id="zoom-in" aria-label="拡大">＋</button>
        <button id="zoom-out" aria-label="縮小">－</button>
        <button id="zoom-home" aria-label="麻布へ">麻</button>
      </div>
      <div id="mode-banner" hidden></div>
      <div id="coach" hidden></div>
      <div id="toast" hidden></div>
    </div>

    <footer id="panel"></footer>
  </section>

  <!-- 季節の変わり目 -->
  <div id="season" hidden>
    <div class="season-inner">
      <div class="season-year" id="season-year"></div>
      <div class="season-kanji" id="season-kanji"></div>
      <div class="season-word" id="season-word"></div>
    </div>
  </div>

  <!-- 合戦 -->
  <div id="battle" hidden></div>

  <!-- 実績の知らせ -->
  <div id="ach-toast" hidden></div>

  <!-- ダイアログ（巻物） -->
  <div id="modal" class="modal" hidden>
    <div class="sheet"><div class="sheet-body" id="modal-body"></div></div>
  </div>

  <!-- 確認（はい／いいえ） -->
  <div id="confirm" class="modal confirm" hidden>
    <div class="sheet"><div class="sheet-body" id="confirm-body"></div></div>
  </div>

  <script src="js/data.js?v=26"></script>
  <script src="js/game.js?v=26"></script>
  <script src="js/events.js?v=26"></script>
  <script src="js/battle.js?v=26"></script>
  <script src="js/schemes.js?v=26"></script>
  <script src="js/diplo.js?v=26"></script>
  <script src="js/records.js?v=26"></script>
  <script src="js/saves.js?v=26"></script>
  <script src="js/art.js?v=26"></script>
  <script src="js/ukiyo.js?v=26"></script>
  <script src="js/portrait.js?v=26"></script>
  <script src="js/sound.js?v=26"></script>
  <script src="js/ui.js?v=26"></script>
</body>
</html>
