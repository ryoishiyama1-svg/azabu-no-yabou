<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>麻布の野望</title>
  <meta name="description" content="麻布高校が都内の高校を攻略していく国盗りシミュレーション">
  <meta name="theme-color" content="#1c1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻布の野望">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- タイトル -->
  <section id="title" class="screen">
    <div class="title-inner">
      <div class="crest">麻</div>
      <h1>麻布の野望</h1>
      <p class="tagline">── 都内高校 国盗り絵巻 ──</p>
      <button class="btn gold" id="btn-resume" hidden>つづきから</button>
      <button class="btn gold" id="btn-new">天下統一をめざす</button>
      <button class="btn ghost" id="btn-help">遊び方</button>
      <p class="disclaimer">※実在の学校名を使ったフィクションです。兵力などの能力値はすべて架空で、実際の学校とは関係ありません。</p>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="game" class="screen" hidden>
    <header class="hud">
      <div><span class="l">時</span><b id="hud-date"></b></div>
      <div><span class="l">金</span><b id="hud-gold"></b></div>
      <div><span class="l">城</span><b id="hud-castles"></b></div>
      <button class="icon" id="btn-menu" aria-label="メニュー">☰</button>
    </header>

    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="zoom">
      <button id="zoom-in" aria-label="拡大">＋</button>
      <button id="zoom-out" aria-label="縮小">－</button>
      <button id="zoom-home" aria-label="麻布へ">麻</button>
    </div>
    <div id="mode-banner" hidden></div>

    <footer id="panel"></footer>
  </section>

  <!-- ダイアログ -->
  <div id="modal" class="modal" hidden>
    <div class="sheet" id="modal-body"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
